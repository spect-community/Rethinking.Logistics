# Derived relations, also written by the sync script.
# `path` is a chain of steps; each step is an auto_ field or a field people type
# (e.g. case_studies). `paths` lists several chains whose results are combined;
# `tagged` instead collects notes of one type by a tag prefix.
derived:
  - on: challenge
    auto: auto_tools
    label: Tools (via metrics)
    path: [auto_metrics, auto_tools]
  - on: domain
    auto: auto_insights
    label: Insights (tagged with the domain)
    # insights carrying the tag domain/<number>-…, set from the context round
    tagged:
      type: insight
      prefix: "domain/{number}-"
    verb: supports
  # domains gather ambitions through their projects (same label = shown in one list)
  - on: ambition
    auto: auto_domains
    label: Domains
    path: [auto_case_studies, auto_domains]
  # metrics through the challenges that serve the ambition
  - on: ambition
    auto: auto_metrics
    label: Metrics
    path: [auto_challenges, auto_metrics]
  # the ambitions a domain gathers through its projects
  - on: domain
    auto: auto_ambitions
    label: Ambitions (through its projects)
    path: [case_studies, ambitions]
  # tools that can calculate the metrics of an ambition (after its metrics are derived)
  - on: ambition
    auto: auto_tools
    label: Tools (via metrics)
    path: [auto_metrics, auto_tools]
