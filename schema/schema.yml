# ─────────────────────────────────────────────────────────────────────────────
# Rethinking Logistics — structure of the knowledge base
#
# The folder decides the type of a note. There are no IDs and no lists of
# allowed values: any value you type in Obsidian is accepted.
#
# Relations
#   You enter a link ONCE, on the "source" side (e.g. tools on a Case study).
#   `npm run sync` (and GitHub on every push) writes the reverse link into the
#   other note, in a property starting with "auto_". Never edit auto_ fields by
#   hand — they are rewritten on every sync.
# ─────────────────────────────────────────────────────────────────────────────

types:
  challenge:
    folder: Challenges
    label: Challenge
    plural: Challenges
    description: A design challenge tackled with evidence-based design.
    fields: [category, status, aliases]

  metric:
    folder: Metrics
    label: Metric
    plural: Metrics
    description: A measurable indicator (students often call it a KPI) used as evidence for a design decision.
    fields: [category, unit, calculation, origin, standard, status, aliases]

  tool:
    folder: Tools
    label: Tool
    plural: Tools
    description: Software (mainly Rhino/Grasshopper, but not only) used to calculate metrics.
    fields: [platform, category, developer, url, license, status, aliases]

  case-study:
    folder: Case studies
    label: Case study
    plural: Case studies
    description: A student project from the Rethinking.Logistics studio showing how tools deliver metrics for decisions.
    fields: [student, project, portfolio, portfolio_pdf, studio, year, location, typology, status, aliases]

  reference:
    folder: Reference projects
    label: Reference project
    plural: Reference projects
    description: A built or planned logistics project from practice, outside the studio. Figures are as published by the developer, the architect or a cited source.
    # stage: planned | under construction | built
    # site_area, floor_area: free text with the unit as published (e.g. "182 acres", "134,500 sq ft")
    fields: [developer, architect, location, year, stage, typology, site_area, floor_area, certifications, url, status, aliases]

  strategy:
    folder: Strategies
    label: Strategy
    plural: Strategies
    description: One of five integration approaches synthesised from the studio's student projects.
    fields: [number, group, summary, hero_image, posters, status, aliases]

  source:
    folder: Sources
    label: Source
    plural: Sources
    description: Where an insight comes from — an expert lecture, a student questionnaire, or an external publication.
    # kind: lecture | questionnaire | publication
    fields: [kind, speaker, affiliation, date, url, status, aliases]

  insight:
    folder: Insights
    label: Insight
    plural: Insights
    description: One atomic statement made by an expert, a student or a publication, with its evidence status.
    # source_type: expert | student | external
    # locator: timestamp or transcript line / PDF page
    # quote_type: paraphrase | verbatim
    # evidence_status: open-for-review | expert-reviewed | disputed
    # relevance: 1–3 (3 = directly informs a metric or decision; 1 = kept, not used on strategy pages)
    fields: [statement, source_type, locator, quote_type, evidence_status, confidence, reviewed_by, relevance, aliases]

# Relations: `field` on `from` is typed by people; `auto` on `to` is written by the sync script.
relations:
  - from: case-study
    field: challenges
    to: challenge
    auto: auto_case_studies
    label: Challenges addressed
    auto_label: Case studies
  - from: case-study
    field: metrics
    to: metric
    auto: auto_case_studies
    label: Metrics used
    auto_label: Used in case studies
  - from: case-study
    field: tools
    to: tool
    auto: auto_case_studies
    label: Tools used
    auto_label: Used in case studies
  - from: tool
    field: metrics
    to: metric
    auto: auto_tools
    label: Metrics it can calculate
    auto_label: Tools that can calculate it
  - from: metric
    field: challenges
    to: challenge
    auto: auto_metrics
    label: Informs decisions on
    auto_label: Metrics
  - from: insight
    field: source
    to: source
    auto: auto_insights
    label: Source
    auto_label: Insights
  - from: insight
    field: challenges
    to: challenge
    auto: auto_insights
    label: Challenges
    auto_label: Insights
  - from: insight
    field: metrics
    to: metric
    auto: auto_insights
    label: Metrics
    auto_label: Insights
  - from: insight
    field: case_studies
    to: case-study
    auto: auto_insights
    label: Case studies
    auto_label: Insights
  - from: strategy
    field: case_studies
    to: case-study
    auto: auto_strategies
    label: Case studies
    auto_label: Strategies
  - from: strategy
    field: challenges
    to: challenge
    auto: auto_strategies
    label: Challenges addressed
    auto_label: Strategies
  - from: strategy
    field: metrics
    to: metric
    auto: auto_strategies
    label: Metrics
    auto_label: Strategies
  - from: reference
    field: challenges
    to: challenge
    auto: auto_references
    label: Challenges addressed
    auto_label: Reference projects
  - from: reference
    field: metrics
    to: metric
    auto: auto_references
    label: Metrics reported
    auto_label: Reported in reference projects
  - from: reference
    field: tools
    to: tool
    auto: auto_references
    label: Tools used
    auto_label: Used in reference projects
  - from: reference
    field: sources
    to: source
    auto: auto_references
    label: Sources
    auto_label: Reference projects
  - from: insight
    field: reference_projects
    to: reference
    auto: auto_insights
    label: Reference projects
    auto_label: Insights
  - from: strategy
    field: reference_projects
    to: reference
    auto: auto_strategies
    label: Reference projects
    auto_label: Strategies

# Derived relations, also written by the sync script.
# `path` is a chain of steps; each step is an auto_ field or a field people type
# (e.g. case_studies). `paths` lists several chains whose results are combined;
# `tagged` instead collects notes of one type by a tag prefix.
derived:
  - on: challenge
    auto: auto_tools
    label: Tools (via metrics)
    path: [auto_metrics, auto_tools]
  - on: strategy
    auto: auto_insights
    label: Insights (tagged with the strategy)
    # insights carrying the tag strategy/<number>-…, set from the context round
    tagged:
      type: insight
      prefix: "strategy/{number}-"
