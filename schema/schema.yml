# ─────────────────────────────────────────────────────────────────────────────
# Rethinking Logistics — structure of the knowledge base
#
# The folder decides the type of a note. There are no IDs and no lists of
# allowed values: any value you type in Obsidian is accepted.
#
# Relations
#   You enter a link ONCE, on the "source" side (e.g. tools on a Case study).
#   `npm run sync` (and GitHub on every push) writes the reverse link into the
#   other note, in a property starting with "auto_". Never edit auto_ fields by
#   hand — they are rewritten on every sync.
# ─────────────────────────────────────────────────────────────────────────────

types:
  ambition:
    folder: Ambitions
    label: Ambition
    plural: Ambitions
    description: An aim a design pursues, taken from how the students framed their briefs. Domains gather them through their projects.
    # category groups the ambitions on the overview page (e.g. Energy, Carbon & circularity, City & community)
    fields: [category, summary, status, aliases]

  challenge:
    folder: Challenges
    label: Challenge
    plural: Challenges
    description: A design challenge tackled with evidence-based design.
    fields: [category, status, aliases]

  metric:
    folder: Metrics
    label: Metric
    plural: Metrics
    description: A measurable indicator (students often call it a KPI) used as evidence for a design decision.
    fields: [category, unit, calculation, origin, standard, status, aliases]

  tool:
    folder: Tools
    label: Tool
    plural: Tools
    description: Software (mainly Rhino/Grasshopper, but not only) used to calculate metrics.
    fields: [platform, category, developer, url, license, status, aliases]

  case-study:
    folder: Case studies
    label: Case study
    plural: Case studies
    description: A student project from the Rethinking.Logistics studio showing how tools deliver metrics for decisions.
    fields: [student, project, portfolio, portfolio_pdf, studio, year, location, typology, status, aliases]

  reference:
    folder: Reference projects
    label: Reference project
    plural: Reference projects
    description: A built or planned logistics project from practice, outside the studio. Figures are as published by the developer, the architect or a cited source.
    # stage: planned | under construction | built
    # site_area, floor_area: free text with the unit as published (e.g. "182 acres", "134,500 sq ft")
    fields: [developer, architect, location, year, stage, typology, site_area, floor_area, certifications, url, status, aliases]

  domain:
    folder: Domains
    label: Domain
    plural: Domains
    description: One of five thematic domains the studio worked in, synthesised from its student projects.
    fields: [number, group, summary, hero_image, posters, status, aliases]

  source:
    folder: Sources
    label: Source
    plural: Sources
    description: Where an insight comes from — an expert lecture, a student questionnaire, or an external publication.
    # kind: lecture | questionnaire | publication
    fields: [kind, speaker, affiliation, date, url, status, aliases]

  insight:
    folder: Insights
    label: Insight
    plural: Insights
    description: One atomic statement made by an expert, a student or a publication, with its evidence status.
    # source_type: expert | student | external
    # locator: timestamp or transcript line / PDF page
    # quote_type: paraphrase | verbatim
    # evidence_status: open-for-review | expert-reviewed | disputed
    # relevance: 1–3 (3 = directly informs a metric or decision; 1 = kept, not used on domain pages)
    fields: [statement, source_type, locator, quote_type, evidence_status, confidence, reviewed_by, relevance, aliases]

# Relations: `field` on `from` is typed by people; `auto` on `to` is written by the sync script.
